<VirtualHost *:80>
    ServerName keducation.site
    ServerAlias www.keducation.site
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/keducation-error.log
    CustomLog ${APACHE_LOG_DIR}/keducation-access.log combined
</VirtualHost>
