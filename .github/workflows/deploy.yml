name: Deploy to Contabo

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check PHP syntax
        run: |
          find . -type f -name '*.php' -not -path './uploads/*' -print0 \
            | xargs -0 -n1 php -l

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST_KEY: ${{ secrets.SERVER_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SERVER_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $SERVER_PORT" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.venv/' \
            --exclude='includes/config.php' \
            --exclude='includes/runtime/' \
            --include='uploads/' \
            --include='uploads/syllabus/' \
            --include='uploads/syllabus/textbook-cache/' \
            --include='uploads/syllabus/textbook-cache/grade-8/' \
            --include='uploads/syllabus/textbook-cache/grade-8/si/***' \
            --exclude='uploads/***' \
            --exclude='backups/' \
            --exclude='*.log' \
            ./ "$SERVER_USER@$SERVER_HOST:$REMOTE_PATH/"

      - name: Install production Gemini secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is missing from the production environment secrets." >&2
            exit 1
          fi
          encoded_key="$(printf '%s' "$GEMINI_API_KEY" | base64 | tr -d '\n')"
          printf "<?php\nreturn base64_decode('%s');\n" "$encoded_key" | \
            ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "set -eu; secret_dir='$REMOTE_PATH/includes/runtime'; mkdir -p \"\$secret_dir\"; key_file=\"\$secret_dir/gemini-secret.php\"; umask 077; cat > \"\$key_file\"; if chgrp www-data \"\$key_file\" 2>/dev/null; then chmod 640 \"\$key_file\"; else chmod 644 \"\$key_file\"; fi"

      - name: Install PDF reader dependencies
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "cd '$REMOTE_PATH' && python3 -m venv .venv && .venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt"

      - name: Import deployed textbook curriculum
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "cd '$REMOTE_PATH' && php database/separate_assessment_questions.php"
