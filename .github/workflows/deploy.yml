name: Deploy to Contabo

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check PHP syntax
        run: |
          find . -type f -name '*.php' -not -path './uploads/*' -print0 \
            | xargs -0 -n1 php -l

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST_KEY: ${{ secrets.SERVER_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SERVER_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $SERVER_PORT" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.venv/' \
            --exclude='includes/config.php' \
            --exclude='includes/runtime/' \
            --include='uploads/' \
            --include='uploads/syllabus/' \
            --include='uploads/syllabus/textbook-cache/' \
            --include='uploads/syllabus/textbook-cache/grade-8/' \
            --include='uploads/syllabus/textbook-cache/grade-8/en/' \
            --include='uploads/syllabus/textbook-cache/grade-8/en/english/' \
            --include='uploads/syllabus/textbook-cache/grade-8/en/english/lesson-1.json' \
            --include='uploads/syllabus/textbook-cache/grade-8/si/***' \
            --exclude='uploads/***' \
            --exclude='backups/' \
            --exclude='android-direct/build/' \
            --exclude='android-direct/signing/' \
            --exclude='downloads/*.apk' \
            --exclude='*.log' \
            ./ "$SERVER_USER@$SERVER_HOST:$REMOTE_PATH/"

      - name: Apply exact Grade 6 History MCQs
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=30 \
            "$SERVER_USER@$SERVER_HOST" \
            "cd '$REMOTE_PATH' && php database/replace_grade6_history_lessons1_3_5_mcq.php"

      - name: Install production Gemini secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is missing from the production environment secrets." >&2
            exit 1
          fi
          encoded_key="$(printf '%s' "$GEMINI_API_KEY" | base64 | tr -d '\n')"
          printf "<?php\nreturn base64_decode('%s');\n" "$encoded_key" | \
            ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "set -eu; secret_dir='$REMOTE_PATH/includes/runtime'; mkdir -p \"\$secret_dir\"; key_file=\"\$secret_dir/gemini-secret.php\"; umask 077; cat > \"\$key_file\"; if chgrp www-data \"\$key_file\" 2>/dev/null; then chmod 640 \"\$key_file\"; else chmod 644 \"\$key_file\"; fi"

      - name: Install production Text.lk secret
        env:
          TEXTLK_API_TOKEN: ${{ secrets.TEXTLK_API_TOKEN }}
          TEXTLK_API_ENDPOINT: ${{ secrets.TEXTLK_API_ENDPOINT }}
          TEXTLK_SENDER_ID: ${{ secrets.TEXTLK_SENDER_ID }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          if [ -z "$TEXTLK_API_TOKEN" ]; then
            echo "TEXTLK_API_TOKEN is missing from the production environment secrets." >&2
            exit 1
          fi
          endpoint="${TEXTLK_API_ENDPOINT:-https://app.text.lk/api/v3/sms/send}"
          sender="${TEXTLK_SENDER_ID:-TextLKDemo}"
          encoded_token="$(printf '%s' "$TEXTLK_API_TOKEN" | base64 | tr -d '\n')"
          encoded_endpoint="$(printf '%s' "$endpoint" | base64 | tr -d '\n')"
          encoded_sender="$(printf '%s' "$sender" | base64 | tr -d '\n')"
          printf "<?php\nreturn ['TEXTLK_API_TOKEN'=>base64_decode('%s'),'TEXTLK_API_ENDPOINT'=>base64_decode('%s'),'TEXTLK_SENDER_ID'=>base64_decode('%s')];\n" "$encoded_token" "$encoded_endpoint" "$encoded_sender" | \
            ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "set -eu; secret_dir='$REMOTE_PATH/includes/runtime'; mkdir -p \"\$secret_dir\"; secret_file=\"\$secret_dir/textlk-secret.php\"; umask 077; cat > \"\$secret_file\"; if chgrp www-data \"\$secret_file\" 2>/dev/null; then chmod 640 \"\$secret_file\"; else chmod 644 \"\$secret_file\"; fi"

      - name: Install PDF reader dependencies
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "cd '$REMOTE_PATH' && python3 -m venv .venv && .venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt"

      - name: Import deployed textbook curriculum
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          ssh_options=(-i ~/.ssh/deploy_key -p "$SERVER_PORT" -o ServerAliveInterval=10 -o ServerAliveCountMax=30)
          ssh "${ssh_options[@]}" "$SERVER_USER@$SERVER_HOST" \
            "cd '$REMOTE_PATH' && php database/seed_sinhala_demo_users.php"
          ssh "${ssh_options[@]}" "$SERVER_USER@$SERVER_HOST" \
            "cd '$REMOTE_PATH' && php database/parent_monitoring_migration.php && php database/separate_assessment_questions.php && php database/core_schema_integrity_migration.php && php database/referral_program_migration.php && php database/enable_grade8_english_all_mediums.php && php database/deploy_grade8_complete.php && php database/enable_grade8_english_all_mediums.php && php database/fix_grade8_math_parimithiya_symbols.php && php database/fix_grade8_sinhala_lesson1_karamin.php"
          for grade in 6 7 9 10; do
            ssh "${ssh_options[@]}" "$SERVER_USER@$SERVER_HOST" \
              "cd '$REMOTE_PATH' && php database/deploy_grades_quick_learning_local.php '$grade'"
          done
          ssh "${ssh_options[@]}" "$SERVER_USER@$SERVER_HOST" \
            "cd '$REMOTE_PATH' && php database/replace_grade6_history_lessons1_3_5_mcq.php"
          ssh "${ssh_options[@]}" "$SERVER_USER@$SERVER_HOST" \
            "cd '$REMOTE_PATH' && php database/replace_grade8_buddhism_lessons1_3.php"
          ssh "${ssh_options[@]}" "$SERVER_USER@$SERVER_HOST" \
            "cd '$REMOTE_PATH' && php database/replace_grade8_buddhism_lessons4_10.php"
          ssh "${ssh_options[@]}" "$SERVER_USER@$SERVER_HOST" \
            "cd '$REMOTE_PATH' && php database/verify_grades_quick_learning.php && php database/replace_grade6_buddhism_selected_mcq.php && php database/replace_grade6_civic_lessons1_3_mcq.php && php database/replace_grade6_geography_lesson1_mcq.php && php database/replace_grade6_geography_lessons2_4_mcq.php && php database/replace_grade6_history_lessons1_3_5_mcq.php && php database/replace_grade10_buddhism_lesson1_mcq.php && php database/replace_grade10_buddhism_lesson2_mcq.php && php database/replace_grade10_buddhism_lesson3_mcq.php && php database/replace_grade10_buddhism_lesson4_mcq.php && php database/replace_grade10_buddhism_lesson5_mcq.php && php database/replace_grade10_buddhism_lesson7_mcq.php && php database/replace_grade10_buddhism_lessons9_10_mcq.php && php database/replace_grade10_buddhism_lessons11_13_mcq.php && php database/replace_grade10_buddhism_lessons16_18_mcq.php && php database/replace_grade10_buddhism_lessons22_23_mcq.php && php database/replace_grade10_agriculture_lessons3_4_mcq.php && php database/replace_grade10_agriculture_lesson5_mcq.php && php database/replace_grade10_agriculture_lessons8_10_mcq.php && php database/replace_grade10_civic_lessons3_5_mcq.php && php database/verify_referral_program.php"
