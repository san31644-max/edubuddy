workflows:
  ios-keducation-testflight:
    name: K Education iOS - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: "K education Codemagic"

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: site.keducation.app

      vars:
        XCODE_PROJECT: "ios/KEducation.xcodeproj"
        XCODE_SCHEME: "KEducation"

      xcode: latest

    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Verify project files
        script: |
          echo "Checking K Education project files..."

          test -f "$CM_BUILD_DIR/$XCODE_PROJECT/project.pbxproj"
          test -f "$CM_BUILD_DIR/ios/KEducation/PrivacyInfo.xcprivacy"
          test -f "$CM_BUILD_DIR/ios/KEducation/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"

          echo "Project files verified."

      - name: Set up App Store code signing
        script: |
          echo "Setting up Apple Distribution signing..."

          xcode-project use-profiles \
            --project "$XCODE_PROJECT"

      - name: Build signed IPA
        script: |
          echo "Building K Education for App Store distribution..."

          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD_NUMBER"

    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  ios-keducation-build-only:
    name: K Education iOS - Unsigned Simulator Check
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      xcode: latest

    scripts:
      - name: Compile for iOS Simulator
        script: |
          echo "Building K Education for iOS Simulator..."

          set +e

          xcodebuild \
            -project ios/KEducation.xcodeproj \
            -scheme KEducation \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            clean build > /tmp/keducation-xcodebuild.log 2>&1

          BUILD_STATUS=$?

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "===== XCODE COMPILER ERRORS ====="

            grep -n -B 5 -A 12 -E 'error:|fatal error:' \
              /tmp/keducation-xcodebuild.log || \
              tail -n 250 /tmp/keducation-xcodebuild.log
          else
            echo "Simulator build successful."
            tail -n 80 /tmp/keducation-xcodebuild.log
          fi

          exit "$BUILD_STATUS"

    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log
      - /tmp/keducation-xcodebuild.log
